# Google Drive에서 매일 일괄 생성할 때 사용하는 예시입니다.
# 폴더 URL 전체를 붙여 넣어도 되고 폴더 ID만 적어도 됩니다.
output_dir: output
# 생략하거나 비워두면 Codex의 기본 모델을 사용합니다.
